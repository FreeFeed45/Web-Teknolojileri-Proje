<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Günün Sözü</title>
    <link rel="stylesheet" href="soz.css">
</head>
<body>
    <div class="card">
        <h1>📜 Günün Sözü</h1>
        <p id="quote">Söz yükleniyor...</p>
        <button onclick="sozdegis()">Yeni Söz Getir</button>
    </div>

    <script>
        async function sozdegis() {
            const soz = document.getElementById('quote');
            
            soz.innerText = "Yükleniyor...";

            try {
                const response = await fetch('https://api.adviceslip.com/advice');
                
                

                const data = await response.json();

                soz.innerText = `"${data.slip.advice}"`;

            } catch (error) {
                soz.innerText = "Söz alınırken bir hata oluştu. Lütfen internet bağlantınızı kontrol edin.";
                console.error("Hata Detayı:", error);
            }
        }

        sozdegis();
    </script>
